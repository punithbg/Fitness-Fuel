<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#202024" />
    <meta
      name="description"
      content="Your personal food diary, strength journal, and fitness progress tracker."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness&amp;Fuel | Fitness Journal</title>
  </head>
  <body>
    <script>
      try {
        const preference = localStorage.getItem('form-and-fuel-theme')
        document.documentElement.dataset.theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : preference === 'system' && matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
